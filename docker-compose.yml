services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reportes_progel_app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8083}:80"
    environment:
      TZ: ${TZ:-America/Mexico_City}
      AVEVA_DB_HOST: ${AVEVA_DB_HOST:-}
      AVEVA_DB_PORT: ${AVEVA_DB_PORT:-1433}
      AVEVA_DB_NAME: ${AVEVA_DB_NAME:-}
      AVEVA_DB_USER: ${AVEVA_DB_USER:-}
      AVEVA_DB_PASS: ${AVEVA_DB_PASS:-}
      AVEVA_DB_ENCRYPT: ${AVEVA_DB_ENCRYPT:-false}
      AVEVA_DB_TRUST_SERVER_CERTIFICATE: ${AVEVA_DB_TRUST_SERVER_CERTIFICATE:-true}
      AVEVA_DB_LOGIN_TIMEOUT: ${AVEVA_DB_LOGIN_TIMEOUT:-5}
      AVEVA_DB_TABLE: ${AVEVA_DB_TABLE:-TREND001}
      AVEVA_DB_TIMESTAMP_FIELD: ${AVEVA_DB_TIMESTAMP_FIELD:-Time_Stamp}
      VOTATORS_REFRESH_MS: ${VOTATORS_REFRESH_MS:-60000}
      COCEDORES_REFRESH_MS: ${COCEDORES_REFRESH_MS:-60000}
      CLARIFICADORES_REFRESH_MS: ${CLARIFICADORES_REFRESH_MS:-60000}
      SECADORES_REFRESH_MS: ${SECADORES_REFRESH_MS:-60000}
      SECADORES_DB_HOST: ${SECADORES_DB_HOST:-}
      SECADORES_DB_PORT: ${SECADORES_DB_PORT:-3306}
      SECADORES_DB_NAME: ${SECADORES_DB_NAME:-bd_secadores}
      SECADORES_DB_USER: ${SECADORES_DB_USER:-}
      SECADORES_DB_PASS: ${SECADORES_DB_PASS:-}
      PROCESOS_DB_HOST: ${PROCESOS_DB_HOST:-}
      PROCESOS_DB_PORT: ${PROCESOS_DB_PORT:-3306}
      PROCESOS_DB_NAME: ${PROCESOS_DB_NAME:-progel_procesos}
      PROCESOS_DB_USER: ${PROCESOS_DB_USER:-}
      PROCESOS_DB_PASS: ${PROCESOS_DB_PASS:-}
    volumes:
      - .:/var/www/html
    extra_hosts:
      - "host.docker.internal:host-gateway"

